<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Status — <!--NAMA--></title>
<style>
    :root { --ink: #16161a; --cream: #FFF9E8; --yellow: #FFE500; --muted: #6b6b76; --line: rgba(22,22,26,.14); }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        background: var(--cream); color: var(--ink);
        min-height: 100vh; display: flex; align-items: center; justify-content: center;
        padding: 24px;
        background-image: radial-gradient(circle at 12% 0%, rgba(255,93,162,.08), transparent 33%),
                          radial-gradient(circle at 88% 100%, rgba(61,139,255,.08), transparent 33%);
    }
    .wrap { width: 100%; max-width: 460px; }
    .card {
        background: #fff; border: 3px solid var(--ink); box-shadow: 8px 8px 0 var(--ink);
        padding: 26px 24px;
    }
    .brand { font-size: 13px; font-weight: 800; letter-spacing: .5px; color: var(--muted); margin-bottom: 4px; }
    h1 { font-size: 26px; letter-spacing: -1px; margin-bottom: 14px; }
    .state {
        display: inline-block; border: 3px solid var(--ink); padding: 8px 16px;
        font-weight: 900; font-size: 18px; letter-spacing: 1px; margin-bottom: 18px;
    }
    .state.ok   { background: #D3FFE0; }
    .state.warn { background: #FFF3C4; }
    .state.bad  { background: #FFD9D9; }
    .row { display: flex; justify-content: space-between; gap: 10px; padding: 9px 0; border-top: 2px solid var(--line); font-size: 14px; font-weight: 600; }
    .row b { font-weight: 800; }
    .foot { margin-top: 16px; font-size: 11.5px; color: var(--muted); font-weight: 600; text-align: center; }
    a.back { display: block; margin-top: 14px; text-align: center; color: var(--ink); font-weight: 800; font-size: 13px; }
    @media (prefers-color-scheme: dark) {
        :root { --cream: #141419; --ink: #F2EDE0; --muted: #9a97a0; --line: rgba(255,255,255,.16); }
        .card { background: #1f1f26; }
        .state.ok { background: #17301f; } .state.warn { background: #332e10; } .state.bad { background: #3a1519; }
    }
</style>
</head>
<body>
    <div class="wrap">
        <div class="card">
            <div class="brand">STATUS PAGE</div>
            <h1><!--NAMA--></h1>
            <div class="state <!--CLS-->"><!--STATUS--></div>
            <div class="row"><span>Jadibot online</span><b><!--BOTON--> / <!--BOTTOT--></b></div>
            <div class="row"><span>Uptime proses</span><b><!--UPTIME--></b></div>
            <div class="row"><span>Total pesan dilayani</span><b><!--PESAN--></b></div>
            <div class="row"><span>Total command dijalankan</span><b><!--COMMAND--></b></div>
            <div class="row"><span>Versi bot</span><b>v<!--VERSI--></b></div>
            <div class="foot">Diperbarui <!--WAKTU--> · data agregat, tanpa informasi pribadi</div>
        </div>
        <a class="back" href="/panel">→ Buka panel web</a>
    </div>
</body>
</html>
