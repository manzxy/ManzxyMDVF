<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline — ManzxyMD</title>
<style>
    :root { --ink: #16161a; --cream: #FFF9E8; --yellow: #FFE500; --muted: #6b6b76; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        background: var(--cream); color: var(--ink);
        min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .card {
        background: #fff; border: 3px solid var(--ink); box-shadow: 8px 8px 0 var(--ink);
        padding: 32px 26px; max-width: 420px; width: 100%; text-align: center;
    }
    .ico { font-size: 44px; }
    h1 { font-size: 22px; letter-spacing: -0.5px; margin: 10px 0 8px; }
    p { font-size: 14px; font-weight: 600; color: var(--muted); margin-bottom: 18px; }
    .retry {
        display: inline-block; text-decoration: none;
        font: inherit; font-weight: 900; letter-spacing: .5px; cursor: pointer;
        background: var(--yellow); color: var(--ink);
        border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink);
        padding: 10px 22px;
    }
    .retry:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 var(--ink); }
    @media (prefers-color-scheme: dark) {
        :root { --cream: #141419; --ink: #F2EDE0; --muted: #9a97a0; }
        .card { background: #1f1f26; }
        .retry { color: #16161a; }
    }
</style>
</head>
<body>
    <div class="card">
        <div class="ico">📡</div>
        <h1>Koneksi terputus</h1>
        <p>Panel tidak bisa menghubungi server. Cek internetmu, lalu coba lagi. Halaman yang sudah terbuka tetap bisa digulir.</p>
        <a class="retry" href="/panel">COBA LAGI</a>
    </div>
</body>
</html>
